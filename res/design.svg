<svg viewBox="0 0 1600 400" width="1600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты и фильтры -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1a4a8d" />
      <stop offset="100%" stop-color="#070d1a" />
    </radialGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff44" />
      <stop offset="25%" stop-color="#008822" />
      <stop offset="50%" stop-color="#00ff44" />
      <stop offset="75%" stop-color="#005511" />
      <stop offset="100%" stop-color="#00ff44" />
    </linearGradient>

    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33ff66" />
      <stop offset="100%" stop-color="#00cc33" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. ПЕРВАЯ ИКОНКА (Простая круглая) -->
  <g transform="translate(50, 50)" filter="url(#glow)">
    <circle cx="150" cy="150" r="130" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6" />
    <g transform="translate(10, 10) scale(0.6)">
      <circle cx="260" cy="180" r="28" fill="url(#icon-grad)" />
      <polygon points="340,200 150,130 130,170 320,240" fill="url(#icon-grad)" />
      <path d="M 150 130 Q 80 160 95 280 L 120 280 Q 105 190 130 170 Z" fill="url(#icon-grad)" />
      <rect x="102" y="280" width="10" height="100" fill="url(#icon-grad)" />
      <rect x="91" y="380" width="32" height="25" fill="url(#icon-grad)" />
      <rect x="77" y="405" width="60" height="25" fill="url(#icon-grad)" />
      <path d="M 260 180 L 370 430 L 290 430 L 270 340 L 210 340 L 190 430 L 150 430 Z M 260 220 L 220 310 L 280 310 Z" fill="url(#icon-grad)" fill-rule="evenodd" />
    </g>
  </g>

  <!-- 2. ВТОРАЯ ИКОНКА (Круглая, отцентрированная после удаления текста) -->
  <g transform="translate(450, 50)" filter="url(#glow)">
    <circle cx="150" cy="150" r="130" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6" />
    <g transform="translate(10, 10) scale(0.6)">
      <circle cx="260" cy="180" r="28" fill="url(#icon-grad)" />
      <polygon points="340,200 150,130 130,170 320,240" fill="url(#icon-grad)" />
      <path d="M 150 130 Q 80 160 95 280 L 120 280 Q 105 190 130 170 Z" fill="url(#icon-grad)" />
      <rect x="102" y="280" width="10" height="100" fill="url(#icon-grad)" />
      <rect x="91" y="380" width="32" height="25" fill="url(#icon-grad)" />
      <rect x="77" y="405" width="60" height="25" fill="url(#icon-grad)" />
      <path d="M 260 180 L 370 430 L 290 430 L 270 340 L 210 340 L 190 430 L 150 430 Z M 260 220 L 220 310 L 280 310 Z" fill="url(#icon-grad)" fill-rule="evenodd" />
    </g>
  </g>

  <!-- 3. ТРЕТЬЯ ИКОНКА (Круглая с пунктирным внутренним кольцом) -->
  <g transform="translate(850, 50)" filter="url(#glow)">
    <circle cx="150" cy="150" r="130" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6" />
    <circle cx="150" cy="150" r="120" fill="none" stroke="url(#icon-grad)" stroke-width="1.5" stroke-dasharray="10 20" />
    <g transform="translate(10, 10) scale(0.6)">
      <circle cx="260" cy="180" r="28" fill="url(#icon-grad)" />
      <polygon points="340,200 150,130 130,170 320,240" fill="url(#icon-grad)" />
      <path d="M 150 130 Q 80 160 95 280 L 120 280 Q 105 190 130 170 Z" fill="url(#icon-grad)" />
      <rect x="102" y="280" width="10" height="100" fill="url(#icon-grad)" />
      <rect x="91" y="380" width="32" height="25" fill="url(#icon-grad)" />
      <rect x="77" y="405" width="60" height="25" fill="url(#icon-grad)" />
      <path d="M 260 180 L 370 430 L 290 430 L 270 340 L 210 340 L 190 430 L 150 430 Z M 260 220 L 220 310 L 280 310 Z" fill="url(#icon-grad)" fill-rule="evenodd" />
    </g>
    <path d="M 150 20 Q 280 150 150 280" fill="none" stroke="url(#icon-grad)" stroke-width="3" />
  </g>

  <!-- 4. ЧЕТВЕРТАЯ ИКОНКА (Квадратная рамка, как в оригинале) -->
  <g transform="translate(1250, 50)" filter="url(#glow)">
    <rect width="300" height="300" fill="url(#bg-grad)" rx="8" />
    <rect width="300" height="300" fill="none" stroke="url(#border-grad)" stroke-width="25" rx="8" />
    <g transform="translate(10, 10) scale(0.6)">
      <circle cx="260" cy="180" r="28" fill="url(#icon-grad)" />
      <polygon points="340,200 150,130 130,170 320,240" fill="url(#icon-grad)" />
      <path d="M 150 130 Q 80 160 95 280 L 120 280 Q 105 190 130 170 Z" fill="url(#icon-grad)" />
      <rect x="102" y="280" width="10" height="100" fill="url(#icon-grad)" />
      <rect x="91" y="380" width="32" height="25" fill="url(#icon-grad)" />
      <rect x="77" y="405" width="60" height="25" fill="url(#icon-grad)" />
      <path d="M 260 180 L 370 430 L 290 430 L 270 340 L 210 340 L 190 430 L 150 430 Z M 260 220 L 220 310 L 280 310 Z" fill="url(#icon-grad)" fill-rule="evenodd" />
    </g>
  </g>
</svg>
