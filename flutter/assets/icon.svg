<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1a4a8d" />
      <stop offset="100%" stop-color="#070d1a" />
    </radialGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff44" />
      <stop offset="25%" stop-color="#008822" />
      <stop offset="50%" stop-color="#00ff44" />
      <stop offset="75%" stop-color="#005511" />
      <stop offset="100%" stop-color="#00ff44" />
    </linearGradient>

    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33ff66" />
      <stop offset="100%" stop-color="#00cc33" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <mask id="gap-mask">
      <rect width="500" height="500" fill="white" />
      <line x1="0" y1="260" x2="500" y2="160" stroke="black" stroke-width="12" />
      <line x1="0" y1="380" x2="500" y2="280" stroke="black" stroke-width="12" />
    </mask>
  </defs>

  <rect width="500" height="500" fill="url(#bg-grad)" />

  <rect x="20" y="20" width="460" height="460" fill="none" stroke="url(#border-grad)" stroke-width="40" />

  <g filter="url(#glow)">
    
    <circle cx="250" cy="260" r="180" fill="none" stroke="url(#icon-grad)" stroke-width="4" stroke-dasharray="60 25" />

    <g mask="url(#gap-mask)">
      
      <circle cx="260" cy="180" r="28" fill="url(#icon-grad)" />
      
      <polygon points="340,200 150,130 130,170 320,240" fill="url(#icon-grad)" />
      
      <path d="M 150 130 Q 80 160 95 280 L 120 280 Q 105 190 130 170 Z" fill="url(#icon-grad)" />
      
      <rect x="102" y="280" width="10" height="100" fill="url(#icon-grad)" />
      
      <rect x="91" y="380" width="32" height="25" fill="url(#icon-grad)" />
      <rect x="77" y="405" width="60" height="25" fill="url(#icon-grad)" />
      
      <path d="
        M 260 180 
        L 370 430 
        L 290 430 
        L 270 340 
        L 210 340 
        L 190 430 
        L 150 430 
        Z 
        M 260 220 
        L 220 310 
        L 280 310 
        Z" 
        fill="url(#icon-grad)" 
        fill-rule="evenodd" 
      />
      
    </g>
  </g>
</svg>
